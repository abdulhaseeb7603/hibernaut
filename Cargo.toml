[package]
name = "ccnap"
version = "0.1.0"
edition = "2021"
description = "Puts idle Claude Code sessions to sleep to free RAM, and wakes them the moment you come back"
license = "MIT"
repository = "https://github.com/abdulhaseeb7603/ccnap"
readme = "README.md"
keywords = ["claude", "claude-code", "terminal", "memory", "pty"]
categories = ["command-line-utilities"]

[dependencies]
portable-pty = "0.9"
serde_json = "1"

[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation", "Win32_System_Console", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging",
    "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_Threading",
    "Win32_System_IO", "Win32_UI_Input_KeyboardAndMouse",
] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tao = "0.37"
tray-icon = "0.26"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFRunLoop"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
